spring.application.name=banking-api
server.port=${SERVER_PORT:8080}

# Profil dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banking_db}
spring.datasource.username=${DB_USER:bank}
spring.datasource.password=${DB_PASS:bank_pass}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Kafka (Cloud Stream)
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.cloud.stream.kafka.binder.auto-create-topics=false
spring.cloud.stream.default.content-type=application/json

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:http://localhost:8080}
spring.security.oauth2.resourceserver.jwt.secret=${JWT_SECRET:change-me-in-production-use-a-rsa-key}

# Logging
logging.level.com.corebanking=INFO
logging.level.org.hibernate.SQL=WARN
